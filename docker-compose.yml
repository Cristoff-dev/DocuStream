services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docustream_app
    restart: unless-stopped
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - docustream-net

  pgsql:
    image: postgres:16-alpine
    container_name: docustream_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - docustream-pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docustream-net

  redis:
    image: redis:7-alpine
    container_name: docustream_redis
    ports:
      - "6379:6379"
    volumes:
      - docustream-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - docustream-net

  localstack:
    image: localstack/localstack:3.0
    container_name: docustream_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    networks:
      - docustream-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docustream_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=300
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docustream-net

volumes:
  docustream-pgsql:
  docustream-redis:

networks:
  docustream-net:
    driver: bridge